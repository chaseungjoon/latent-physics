[project]
name = "latent-physics"
version = "0.1.0"
description = "Do state-based neural world models spontaneously learn hidden physical parameters?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.7",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
